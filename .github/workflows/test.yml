name: Automated Tests

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Shellcheck
      uses: ludeeus/action-shellcheck@master
    - name: Behavior tests
      run: ./tests/check-upgrade.sh
    - name: Node version resolution tests
      run: ./tests/resolve-node-version.sh
